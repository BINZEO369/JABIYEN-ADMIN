<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Hero Controller</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 opacity-0 transition-opacity duration-200" id="bodyCtx">

    <nav class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold tracking-wide">Jayenware Hero Controller</h1>
        <div class="flex items-center gap-4">
            <span id="userEmail" class="text-sm text-gray-400"></span>
            <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm font-semibold transition">Logout</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 h-fit">
            <h2 id="formTitle" class="text-lg font-bold mb-4 text-gray-900">Add New Banner</h2>
            
            <form id="heroForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="heroId">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Title</label>
                    <input type="text" id="title" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="e.g., Premium Streetwear Collection">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Subtitle</label>
                    <input type="text" id="subtitle" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="e.g., Limited Edition Graphic T-Shirts">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Image URL</label>
                    <input type="url" id="img" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="https://example.com/image.jpg" required>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">CTA Text</label>
                        <input type="text" id="cta_text" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="Shop Now">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">CTA Link</label>
                        <input type="text" id="cta_link" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="/products">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium mb-1">Sort Order</label>
                        <input type="number" id="sort_order" value="0" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" required>
                    </div>
                    <div class="flex items-center mt-6">
                        <input type="checkbox" id="is_active" checked class="w-4 h-4 text-gray-950 border-gray-300 rounded focus:ring-gray-900">
                        <label for="is_active" class="ml-2 text-sm font-medium">Active Banner</label>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="saveBtn" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-semibold py-2 rounded transition">Save Banner</button>
                    <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded transition">Cancel</button>
                </div>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
            <h2 class="text-lg font-bold mb-4 text-gray-900">Active & Inactive Banners</h2>
            
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-200 text-sm font-semibold text-gray-600">
                        <th class="pb-3 width-16">Image</th>
                        <th class="pb-3">Details</th>
                        <th class="pb-3 text-center">Order</th>
                        <th class="pb-3 text-center">Status</th>
                        <th class="pb-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="heroTableBody" class="divide-y divide-gray-100 text-sm">
                    <tr>
                        <td colspan="5" class="py-8 text-center text-gray-500">Loading banners...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ১. Supabase ইনিশিয়ালাইজেশন
        const SUPABASE_URL = "https://eiueitoxxqzkolsouuzy.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpdWVpdG94eHF6a29sc291dXp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjIxNjIsImV4cCI6MjA5OTMzODE2Mn0.zsmN5P-AXeKT-XLgqkq0Bjx8EfjupJs1mjC26l-g7uA";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ২. ইনস্ট্যান্ট সিকিউরিটি চেক (Immediate Execution)
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                // সেশন না থাকলে সরাসরি login.html এ পাঠিয়ে দেওয়া হবে
                window.location.href = 'login.html';
                return;
            }

            // রোল-বেসড সিকিউরিটি চেক (RLS পলিসি অনুযায়ী admin বা super_admin হতে হবে)
            const role = session.user.app_metadata?.role;
            if (role !== 'admin' && role !== 'super_admin') {
                await supabase.auth.signOut();
                window.location.href = 'login.html';
                return;
            }

            // সেশন এবং রোল ভ্যালিড থাকলে UI ভিজিবল করা এবং ডেটা লোড করা
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById('userEmail').textContent = session.user.email;
                document.getElementById('bodyCtx').classList.remove('opacity-0');
                fetchHeroes();
            });
        }
        
        // ফাংশনটি সাথে সাথে এক্সিকিউট করা হচ্ছে যাতে DOM লোডের জন্য অপেক্ষা করতে না হয়
        checkAuth();

        // ৩. ড্যাশবোর্ডে ডেটা রিড (Read) করা
        async function fetchHeroes() {
            const tableBody = document.getElementById('heroTableBody');
            try {
                const { data, error } = await supabase
                    .from('hero')
                    .select('*')
                    .order('sort_order', { ascending: true });

                if (error) throw error;

                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-500">No banners found. Add one on the left.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                data.forEach(hero => {
                    tableBody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="py-4 pr-3">
                                <img src="${hero.img}" class="w-16 h-10 object-cover rounded border border-gray-200" onerror="this.src='https://placehold.co/100x60?text=No+Image'">
                            </td>
                            <td class="py-4">
                                <div class="font-semibold text-gray-900">${hero.title || 'Untitled'}</div>
                                <div class="text-xs text-gray-500">${hero.subtitle || 'No Subtitle'}</div>
                                <div class="text-xs text-blue-600 mt-1">${hero.cta_text ? `${hero.cta_text} -> ${hero.cta_link}` : ''}</div>
                            </td>
                            <td class="py-4 text-center font-mono">${hero.sort_order}</td>
                            <td class="py-4 text-center">
                                <span class="px-2 py-1 rounded text-xs font-semibold ${hero.is_active ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                                    ${hero.is_active ? 'Active' : 'Inactive'}
                                </span>
                            </td>
                            <td class="py-4 text-right space-x-2">
                                <button onclick='editHero(${JSON.stringify(hero)})' class="text-blue-600 hover:text-blue-900 font-medium">Edit</button>
                                <button onclick="deleteHero(${hero.id})" class="text-red-600 hover:text-red-900 font-medium">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                alert("Error fetching data: " + error.message);
            }
        }

        // ৪. ডেটা সাবমিট করা (Insert / Update)
        async function handleSubmit(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            const id = document.getElementById('heroId').value;
            const payload = {
                title: document.getElementById('title').value,
                subtitle: document.getElementById('subtitle').value,
                img: document.getElementById('img').value,
                cta_text: document.getElementById('cta_text').value,
                cta_link: document.getElementById('cta_link').value,
                sort_order: parseInt(document.getElementById('sort_order').value) || 0,
                is_active: document.getElementById('is_active').checked
            };

            try {
                if (id) {
                    const { error } = await supabase.from('hero').update(payload).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabase.from('hero').insert([payload]);
                    if (error) throw error;
                }

                resetForm();
                fetchHeroes();
            } catch (error) {
                alert("Operation failed: " + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Banner';
            }
        }

        // ৫. এডিট মুড চালু করা
        function editHero(hero) {
            document.getElementById('formTitle').textContent = "Edit Banner Details";
            document.getElementById('heroId').value = hero.id;
            document.getElementById('title').value = hero.title || '';
            document.getElementById('subtitle').value = hero.subtitle || '';
            document.getElementById('img').value = hero.img || '';
            document.getElementById('cta_text').value = hero.cta_text || '';
            document.getElementById('cta_link').value = hero.cta_link || '';
            document.getElementById('sort_order').value = hero.sort_order;
            document.getElementById('is_active').checked = hero.is_active;

            document.getElementById('cancelBtn').classList.remove('hidden');
            document.getElementById('saveBtn').textContent = "Update Banner";
        }

        // ৬. ফর্ম রিসেট বা ক্লিয়ার করা
        function resetForm() {
            document.getElementById('formTitle').textContent = "Add New Banner";
            document.getElementById('heroId').value = '';
            document.getElementById('heroForm').reset();
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('saveBtn').textContent = "Save Banner";
        }

        // ৭. ডিলিট অপারেশন (Delete)
        async function deleteHero(id) {
            if (confirm("Are you sure you want to delete this banner?")) {
                try {
                    const { error } = await supabase.from('hero').delete().eq('id', id);
                    if (error) throw error;
                    fetchHeroes();
                } catch (error) {
                    alert("Delete failed: " + error.message);
                }
            }
        }

        // ৮. লগআউট হ্যান্ডেলার
        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
