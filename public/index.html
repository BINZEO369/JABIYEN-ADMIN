<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Hero Controller</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 opacity-0 transition-opacity duration-200" id="bodyCtx">

    <nav class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold tracking-wide">Jayenware Hero Controller</h1>
        <div class="flex items-center gap-4">
            <span id="userEmail" class="text-sm text-gray-400"></span>
            <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm font-semibold transition">Logout</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 h-fit">
            <h2 id="formTitle" class="text-lg font-bold mb-4 text-gray-900">Add New Banner</h2>
            
            <form id="heroForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="heroId">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Title</label>
                    <input type="text" id="title" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="e.g., Premium Streetwear Collection">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Subtitle</label>
                    <input type="text" id="subtitle" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="e.g., Limited Edition Graphic T-Shirts">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Image URL</label>
                    <input type="url" id="img" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="https://example.com/image.jpg" required>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">CTA Text</label>
                        <input type="text" id="cta_text" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="Shop Now">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">CTA Link</label>
                        <input type="text" id="cta_link" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" placeholder="/products">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium mb-1">Sort Order</label>
                        <input type="number" id="sort_order" value="0" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-gray-900" required>
                    </div>
                    <div class="flex items-center mt-6">
                        <input type="checkbox" id="is_active" checked class="w-4 h-4 text-gray-950 border-gray-300 rounded focus:ring-gray-900">
                        <label for="is_active" class="ml-2 text-sm font-medium">Active Banner</label>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="saveBtn" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-semibold py-2 rounded transition">Save Banner</button>
                    <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded transition">Cancel</button>
                </div>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
            <h2 class="text-lg font-bold mb-4 text-gray-900">Active & Inactive Banners</h2>
            
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-200 text-sm font-semibold text-gray-600">
                        <th class="pb-3 width-16">Image</th>
                        <th class="pb-3">Details</th>
                        <th class="pb-3 text-center">Order</th>
                        <th class="pb-3 text-center">Status</th>
                        <th class="pb-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="heroTableBody" class="divide-y divide-gray-100 text-sm">
                    <tr>
                        <td colspan="5" class="py-8 text-center text-gray-500">Loading banners...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const sessionKey = 'jayenware_admin_session';
        const getToken = () => { try { return JSON.parse(localStorage.getItem(sessionKey) || '{}').access_token || ''; } catch { return ''; } };
        const api = async (path, options = {}) => {
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            const token = getToken();
            if (token) headers.Authorization = `Bearer ${token}`;
            const response = await fetch(path, { ...options, headers });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(body.error || body.message || `Request failed (${response.status})`);
            return body;
        };
        async function checkAuth() {
            try {
                const result = await api('/api/admin/me');
                const user = result.data?.user || result.user || {};
                void api('/api/project-access/record', { method: 'POST', body: JSON.stringify({ project_key: 'jabiyen', client_key: 'admin', event_type: 'token_verified', outcome: 'success', metadata: { source: 'jabiyen-admin' } }) }).catch(() => {});
                document.addEventListener('DOMContentLoaded', () => {
                    document.getElementById('userEmail').textContent = user.email || '';
                    document.getElementById('bodyCtx').classList.remove('opacity-0');
                    fetchHeroes();
                });
            } catch { window.location.href = 'login.html'; }
        }
        checkAuth();
        async function fetchHeroes() {
            const tableBody = document.getElementById('heroTableBody');
            try {
                const result = await api('/api/admin/hero');
                const data = result.banners || result.data || [];
                if (!data.length) { tableBody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-gray-500">No banners found. Add one on the left.</td></tr>'; return; }
                tableBody.innerHTML = data.map(hero => `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="py-4 pr-3"><img src="${hero.img || ''}" class="w-16 h-10 object-cover rounded border border-gray-200" onerror="this.src='https://placehold.co/100x60?text=No+Image'"></td>
                        <td class="py-4"><div class="font-semibold text-gray-900">${hero.title || 'Untitled'}</div><div class="text-xs text-gray-500">${hero.subtitle || 'No Subtitle'}</div><div class="text-xs text-blue-600 mt-1">${hero.cta_text ? `${hero.cta_text} -> ${hero.cta_link || ''}` : ''}</div></td>
                        <td class="py-4 text-center font-mono">${hero.sort_order ?? 0}</td>
                        <td class="py-4 text-center"><span class="px-2 py-1 rounded text-xs font-semibold ${hero.is_active ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">${hero.is_active ? 'Active' : 'Inactive'}</span></td>
                        <td class="py-4 text-right space-x-2"><button onclick='editHero(${JSON.stringify(hero)})' class="text-blue-600 hover:text-blue-900 font-medium">Edit</button><button onclick="deleteHero(${hero.id})" class="text-red-600 hover:text-red-900 font-medium">Delete</button></td>
                    </tr>`).join('');
            } catch (error) { alert('Error fetching data: ' + error.message); }
        }
        async function handleSubmit(e) {
            e.preventDefault(); const saveBtn = document.getElementById('saveBtn'); saveBtn.disabled = true; saveBtn.textContent = 'Saving...';
            const id = document.getElementById('heroId').value;
            const payload = { title: document.getElementById('title').value, subtitle: document.getElementById('subtitle').value, img: document.getElementById('img').value, cta_text: document.getElementById('cta_text').value, cta_link: document.getElementById('cta_link').value, sort_order: parseInt(document.getElementById('sort_order').value) || 0, is_active: document.getElementById('is_active').checked };
            try { await api(id ? `/api/admin/hero/${id}` : '/api/admin/hero', { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) }); resetForm(); await fetchHeroes(); } catch (error) { alert('Operation failed: ' + error.message); } finally { saveBtn.disabled = false; saveBtn.textContent = 'Save Banner'; }
        }
        function editHero(hero) { document.getElementById('formTitle').textContent = 'Edit Banner Details'; document.getElementById('heroId').value = hero.id; document.getElementById('title').value = hero.title || ''; document.getElementById('subtitle').value = hero.subtitle || ''; document.getElementById('img').value = hero.img || ''; document.getElementById('cta_text').value = hero.cta_text || ''; document.getElementById('cta_link').value = hero.cta_link || ''; document.getElementById('sort_order').value = hero.sort_order ?? 0; document.getElementById('is_active').checked = !!hero.is_active; document.getElementById('cancelBtn').classList.remove('hidden'); document.getElementById('saveBtn').textContent = 'Update Banner'; }
        function resetForm() { document.getElementById('formTitle').textContent = 'Add New Banner'; document.getElementById('heroId').value = ''; document.getElementById('heroForm').reset(); document.getElementById('cancelBtn').classList.add('hidden'); document.getElementById('saveBtn').textContent = 'Save Banner'; }
        async function deleteHero(id) { if (!confirm('Are you sure you want to delete this banner?')) return; try { await api(`/api/admin/hero/${id}`, { method: 'DELETE' }); await fetchHeroes(); } catch (error) { alert('Delete failed: ' + error.message); } }
        async function handleLogout() { try { await api('/api/auth/logout', { method: 'POST' }); } finally { localStorage.removeItem(sessionKey); window.location.href = 'login.html'; } }
    </script>
</body>
</html>
