<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hero Section Controller</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Modern, Clean UI Design */
        :root {
            --primary-color: #111827;
            --primary-hover: #374151;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #d1d5db;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .login-header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .alert-message {
            display: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid transparent;
        }
        
        .alert-danger {
            background-color: #fee2e2;
            color: var(--error-color);
            border-color: #f87171;
        }

        .alert-success {
            background-color: #d1fae5;
            color: var(--success-color);
            border-color: #34d399;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Admin Login</h2>
            <p>Access the Hero Section Dashboard</p>
        </div>

        <div id="alertBox" class="alert-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="admin@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>
    </div>

    <script>
        // ১. Supabase ইনিশিয়ালাইজেশন
        const SUPABASE_URL = "https://eiueitoxxqzkolsouuzy.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpdWVpdG94eHF6a29sc291dXp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjIxNjIsImV4cCI6MjA5OTMzODE2Mn0.zsmN5P-AXeKT-XLgqkq0Bjx8EfjupJs1mjC26l-g7uA";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ২. সেশন চেক করা (ইউজার অলরেডি লগইন থাকলে মেইন রুটে রিডাইরেক্ট করবে)
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                // আপনার RLS পলিসি অনুযায়ী রোল ভ্যালিডেশন
                const role = session.user.app_metadata?.role;
                if (role === 'admin' || role === 'super_admin') {
                    window.location.href = 'index.html';
                }
            }
        }
        checkSession();

        // ৩. ডম এলিমেন্ট সিলেকশন
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        // এলার্ট দেখানোর হেল্পার ফাংশন
        function showAlert(message, type = 'danger') {
            alertBox.textContent = message;
            alertBox.className = `alert-message alert-${type}`;
            alertBox.style.display = 'block';
        }

        // ৪. লগ ইন সাবমিট হ্যান্ডেলার
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI রিসেট ও লোডিং স্টেট
            alertBox.style.display = 'none';
            submitBtn.textContent = 'Verifying Credentials...';
            submitBtn.disabled = true;

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try {
                // Supabase Auth এ সাইন-ইন রিকোয়েস্ট
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                // সেশন থেকে ইউজারের রোল (Role) বের করা
                const userRole = data.session?.user?.app_metadata?.role;

                // ৫. রোল অথরাইজেশন চেক (আপনার SQL স্ক্রিপ্টের RLS অনুযায়ী)
                if (userRole === 'admin' || userRole === 'super_admin') {
                    showAlert('Login Successful! Redirecting to dashboard...', 'success');
                    
                    // মসৃণ রিডাইরেকশনের জন্য সামান্য ডিলে
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);
                } else {
                    // যদি ইউজার অথেনটিকেটেড হয় কিন্তু এডমিন রোল না থাকে, তাহলে সেশন ক্লিয়ার করে এরর মেসেজ দেবে
                    await supabase.auth.signOut();
                    throw new Error("Access Denied: You do not have administrator privileges.");
                }

            } catch (error) {
                // যেকোনো এরর বা ভুল ক্রেডেনশিয়ালের ক্ষেত্রে মেসেজ শো করবে
                showAlert(error.message || "Invalid login credentials.", 'danger');
                submitBtn.textContent = 'Sign In';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
