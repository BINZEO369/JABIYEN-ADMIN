<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f6f8" />
  <title>Admin Sign In | JABIYEN</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#182230;background:#f5f6f8;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}main{width:min(100%,430px);padding:34px 30px;background:#fff;border:1px solid #e5e9ef;border-radius:18px;box-shadow:0 16px 45px #17233612}header{text-align:center;margin-bottom:25px}img{width:52px;height:52px;border-radius:13px;object-fit:cover}h1{font-size:23px;letter-spacing:-.04em;margin:14px 0 5px}header p{margin:0;color:#758196;font-size:12px;line-height:1.5}.field{margin:15px 0;text-align:left}label{display:block;margin-bottom:6px;font-size:11px;font-weight:700;color:#435167}input{width:100%;min-height:43px;border:1px solid #d8dee7;border-radius:9px;padding:10px 12px;font:13px Inter,system-ui,sans-serif;color:#182230;outline:none}input:focus{border-color:#60728d;box-shadow:0 0 0 3px #60728d1a}.primary{width:100%;min-height:44px;border:0;border-radius:9px;background:#172336;color:#fff;font:700 12px Inter,system-ui,sans-serif;cursor:pointer;margin-top:8px}.primary:disabled{opacity:.55;cursor:wait}.status{min-height:20px;margin-top:13px;font-size:11px;line-height:1.5;color:#68768b;text-align:center}.status.error{color:#a32121}footer{margin-top:20px;padding-top:14px;border-top:1px solid #eef1f5;color:#97a1af;font-size:10px;text-align:center;line-height:1.5}@media(max-width:480px){main{padding:27px 21px}}
  </style>
</head>
<body>
  <main>
    <header>
      <img src="/logo.png" alt="JABIYEN" />
      <h1>Admin Sign In</h1>
      <p>Sign in with the administrator account registered for JABIYEN.</p>
    </header>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Admin email</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254" /></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="72" /></div>
      <button class="primary" id="submitButton" type="submit">Sign in</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <footer>Password is verified by JABIYEN Database Auth and matched to an active row in the admins table. It is never stored in this browser.</footer>
  </main>
  <script>
    (() => {
      const form = document.getElementById('loginForm');
      const button = document.getElementById('submitButton');
      const status = document.getElementById('status');
      const sessionKey = 'jayenware_admin_session';
      const errorMessage = (result) => {
        const error = result && result.error;
        return (typeof error === 'string' ? error : error && error.message) || result && result.message || 'Admin sign-in failed.';
      };
      function showError(message) {
        status.textContent = message;
        status.className = 'status error';
      }
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) { showError('Enter your admin email and password.'); return; }
        button.disabled = true;
        button.textContent = 'Checking…';
        status.textContent = 'Checking JABIYEN database credentials…';
        status.className = 'status';
        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 20000);
        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
            signal: controller.signal,
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || result.success !== true || !result.data || !result.data.session || !result.data.session.access_token) {
            throw new Error(errorMessage(result));
          }
          const session = result.data.session;
          const sessionRecord = {
            access_token: session.access_token,
            refresh_token: session.refresh_token || null,
            expires_at: session.expires_at || null,
            user_id: session.user && session.user.id || result.data.user && result.data.user.id || null,
            login_type: 'jabiyen_admin',
          };
          const verifyResponse = await fetch('/api/admin/session', { headers: { Authorization: `Bearer ${session.access_token}` }, signal: controller.signal });
          const verified = await verifyResponse.json().catch(() => ({}));
          if (!verifyResponse.ok || verified.success !== true) {
            throw new Error(errorMessage(verified) || 'This account does not have active JABIYEN admin access.');
          }
          localStorage.setItem(sessionKey, JSON.stringify(sessionRecord));
          window.location.replace('/dashboard');
        } catch (error) {
          showError(error.name === 'AbortError' ? 'Sign-in timed out. Please try again.' : (error.message || 'Invalid admin credentials or inactive admin account.'));
          button.disabled = false;
          button.textContent = 'Sign in';
        } finally {
          window.clearTimeout(timeoutId);
        }
      });
    })();
  </script>
</body>
</html>
