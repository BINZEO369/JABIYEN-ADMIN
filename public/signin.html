<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Admin Sign In | JABIYEN</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f5f7; color: #1d1d1f; }
    main { width: min(100%, 440px); padding: 40px 36px; text-align: center; background: #fff; border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,.08); }
    img { width: 56px; height: 56px; border-radius: 15px; margin-bottom: 16px; }
    h1 { margin: 0 0 10px; font-size: 25px; letter-spacing: -.03em; }
    p { margin: 0; color: #68686d; line-height: 1.6; font-size: 14px; }
    .status { margin-top: 24px; color: #86868b; font-size: 14px; }
    .error { color: #b42318; }
    a { display: inline-block; margin-top: 18px; color: #0066cc; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="JABIYEN" />
    <h1>Secure Admin Sign In</h1>
    <p>Authentication is handled centrally by BINZEO Auth. Email, OTP, token, QR and passkey verification never run on this admin site.</p>
    <div id="status" class="status">Opening Central BINZEO Auth…</div>
    <a id="retry" href="/signin" hidden>Try again</a>
  </main>
  <script>
    (function () {
      var CENTRAL_AUTH = 'https://auth-binzeo.vercel.app/signin';
      var CLIENT_ID = 'jabiyen:admin';
      var started = false;
      var status = document.getElementById('status');
      var retry = document.getElementById('retry');

      function base64Url(bytes) {
        var binary = '';
        bytes.forEach(function (byte) { binary += String.fromCharCode(byte); });
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
      }
      function randomValue(length) {
        var bytes = new Uint8Array(length);
        window.crypto.getRandomValues(bytes);
        return base64Url(bytes);
      }
      async function challenge(verifier) {
        var digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
        return base64Url(new Uint8Array(digest));
      }
      async function start() {
        if (started) return;
        started = true;
        try {
          var redirectUri = window.location.origin + '/auth/callback.html';
          var state = randomValue(32);
          var verifier = randomValue(48);
          var codeChallenge = await challenge(verifier);
          sessionStorage.setItem('jabiyen_admin_auth_state', state);
          sessionStorage.setItem('jabiyen_admin_auth_verifier', verifier);
          sessionStorage.setItem('jabiyen_admin_auth_redirect_uri', redirectUri);
          var url = new URL(CENTRAL_AUTH);
          url.searchParams.set('client_id', CLIENT_ID);
          url.searchParams.set('redirect_uri', redirectUri);
          url.searchParams.set('state', state);
          url.searchParams.set('code_challenge', codeChallenge);
          url.searchParams.set('code_challenge_method', 'S256');
          window.location.replace(url.toString());
        } catch (error) {
          console.error('[JABIYEN_ADMIN_AUTH_REDIRECT_ERROR]', error);
          status.textContent = 'Central authentication could not be opened. Please try again.';
          status.className = 'status error';
          retry.hidden = false;
        }
      }
      void start();
    }());
  </script>
</body>
</html>
